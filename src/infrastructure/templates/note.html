<!DOCTYPE html>
<html lang="{{LANG}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{PAGE_TITLE}}</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .container {
        background: white;
        border-radius: 15px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 40px;
        max-width: 600px;
        width: 100%;
      }
      .header {
        text-align: center;
        margin-bottom: 30px;
      }
      .header h1 {
        color: #667eea;
        font-size: 28px;
        margin-bottom: 10px;
      }
      .date {
        color: #999;
        font-size: 14px;
      }
      .note-content {
        background: #f8f9fa;
        border-left: 4px solid #667eea;
        padding: 25px;
        border-radius: 8px;
        line-height: 1.8;
        font-size: 16px;
        color: #333;
        font-style: italic;
      }
      .footer {
        text-align: center;
        margin-top: 25px;
        color: #999;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>{{HEADER_TITLE}}</h1>
        <p class="date">{{DATE}}</p>
      </div>
      <div class="note-content">
        {{NOTE}}
      </div>
      <div class="footer">
        <p>{{FOOTER_TEXT}}</p>
      </div>
    </div>
  </body>
</html>
